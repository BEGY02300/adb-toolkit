name: Test du script Python ADB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Permet de le lancer manuellement

jobs:
  test-python:
    name: Vérifier le code Python
    runs-on: ubuntu-latest # Utilise Linux, c'est plus rapide et gratuit

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer les dépendances (Rich)
        run: |
          python -m pip install --upgrade pip
          pip install rich

      - name: Vérifier la syntaxe de adb_toolkit.py
        run: python -m py_compile adb_toolkit.py
